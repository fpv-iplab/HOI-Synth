_BASE_: ../Base-DA-HOS-R101-FPN.yaml
MODEL:
  OBJECT_MODULE: False
  MASK_ON: True
  ROI_HEADS:
    NUM_CLASSES: 2
  POINT_HEAD:
    NUM_CLASSES: 2
DATASETS:
  CROSS_DATASET: True
  TRAIN: ("S_hoisynth+visor10-T_visor",)
  TRAIN_LABEL: ("S_hoisynth+visor10-T_visor",) 
  TRAIN_IMAGES_PATH: ("/datasets/HOI-Synth/visor_egohos_synth/images_combined_visor", )
  TRAIN_ANNOTATIONS_PATH: ("/datasets/HOI-Synth/visor_egohos_synth/annotations/train_10.json", )
  TEST: ("labeled_val",)
  TEST_IMAGES_PATH: ("/datasets/HOI-Synth/visor/images", )
  TEST_ANNOTATIONS_PATH: ("/datasets/HOI-Synth/visor/annotations/val.json", )
  TRAIN_UNLABEL: ("unlabeled_train",)
  TRAIN_UNLABEL_IMAGES_PATH: ("/datasets/HOI-Synth/visor/images", )
  TRAIN_UNLABEL_ANNOTATIONS_PATH: ("/datasets/HOI-Synth/visor/annotations/train_unlabeled.json", )
TEST:
  EVAL_PERIOD: 10000
SOLVER:
  LR_SCHEDULER_NAME: "WarmupTwoStageMultiStepLR"
  STEPS: (60000, 80000, 90000)
  FACTOR_LIST: (1, 0.1, 0.01, 0.01)
  MAX_ITER: 100000
  CHECKPOINT_PERIOD: 10000
  IMG_PER_BATCH_LABEL: 4
  IMG_PER_BATCH_UNLABEL: 4
  IMS_PER_BATCH: 12
  BASE_LR: 0.0005
  WARMUP_FACTOR: 0.0001
  WARMUP_ITERS: 1000
  WARMUP_METHOD: linear
SEMISUPNET:
  BURN_UP_STEP: 20000